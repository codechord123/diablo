<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>분수 던전 — Fraction Dungeon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="levelup" class="levelup-banner"></div>

  <div class="hud">
    <div class="hud-block">
      <span class="hud-label">레벨</span>
      <span id="lv" class="hud-value">1</span>
    </div>
    <div class="hud-block bar-block">
      <span class="hud-label">HP <span id="hp">5 / 5</span></span>
      <div class="bar"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
    </div>
    <div class="hud-block bar-block">
      <span class="hud-label">XP <span id="xp">0 / 50</span></span>
      <div class="bar"><div id="xp-bar" class="bar-fill xp-fill"></div></div>
    </div>
    <div class="hud-block">
      <span class="hud-label">처치</span>
      <span id="kills" class="hud-value">0</span>
    </div>
  </div>

  <main class="arena">
    <section id="monster" class="monster">
      <div id="monster-emoji" class="monster-emoji">💀</div>
      <div class="monster-info">
        <div id="monster-name" class="monster-name">해골 전사</div>
        <div class="bar small"><div id="monster-hp-bar" class="bar-fill monster-fill"></div></div>
        <div id="monster-hp" class="monster-hp">2 / 2</div>
      </div>
    </section>

    <section class="problem-card">
      <div class="problem-label">⚔️ 공격하려면 정답을 골라라!</div>
      <div id="problem-text" class="problem-text">1/2 + 1/3 = ?</div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback"></div>
    </section>

    <section id="player" class="player">
      <div class="player-emoji">🧙</div>
      <div class="player-name">용감한 모험가</div>
    </section>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
