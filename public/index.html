<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>분수 던전 RPG — Fraction Dungeon</title>
  <link rel="stylesheet" href="css/fraction.css" />
  <link rel="stylesheet" href="css/rpg.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <!-- 상단 HUD -->
  <header class="hud-bar">
    <div class="hud-cell hud-class-cell"><span id="hud-class">⚔️ 전사</span></div>
    <div class="hud-cell"><span class="hud-key">Lv</span><span id="hud-lv">1</span></div>
    <div class="hud-cell"><span class="hud-key">HP</span><span id="hud-hp">5/5</span></div>
    <div class="hud-cell"><span class="hud-key">XP</span><span id="hud-xp">0/50</span></div>
    <div class="hud-cell"><span class="hud-key">💰</span><span id="hud-gold">0</span></div>
    <div class="hud-cell"><span class="hud-key">처치</span><span id="hud-kills">0</span></div>
    <div class="hud-cell"><span id="hud-weapon">🗡️</span></div>
    <div class="hud-cell"><span id="hud-potion">🧪0</span></div>
    <div class="hud-cell hud-right">
      <span id="hud-user" class="hud-user"></span>
      <button id="hud-logout" class="hud-logout" title="로그아웃">🚪</button>
      <a href="dashboard.html" class="link-classic" target="_blank">📊 대시보드</a>
    </div>
  </header>

  <!-- Phaser 게임 캔버스 -->
  <div id="game-canvas"></div>

  <!-- 도움말 -->
  <footer class="help-bar">
    🖱️/⌨️ WASD = 이동 · 1~4 = 답 · H = 포션 · N = 풀이노트 · E = 계단 · Q = 마을 · ESC = 도주 · R = 재생성 · 🔊 사운드
  </footer>

  <!-- 레벨업 배너 -->
  <div id="levelup-banner" class="levelup-banner"></div>

  <!-- 전투 모달 (DOM 오버레이) -->
  <div id="battle-modal" class="battle-modal">
    <div class="bm-card">
      <div class="bm-enemy">
        <span id="bm-enemy-emoji" class="bm-enemy-emoji">💀</span>
        <div class="bm-enemy-info">
          <div id="bm-enemy-name" class="bm-enemy-name">해골 전사</div>
          <div id="bm-category" class="bm-category">📚 동분모 덧셈</div>
          <div class="bm-hpbar"><div id="bm-enemy-hpbar" class="bm-hpbar-fill"></div></div>
          <div id="bm-enemy-hp" class="bm-enemy-hp">2 / 2</div>
        </div>
      </div>

      <!-- 보스 타이머 (보스전에만 표시) -->
      <div id="bm-timer" class="bm-timer" style="display:none">
        <div id="bm-timer-text" class="bm-timer-text">⏱ 60초</div>
        <div class="bm-timer-bar-bg">
          <div id="bm-timer-bar" class="bm-timer-bar-fill"></div>
        </div>
      </div>

      <div id="bm-problem" class="bm-problem"></div>
      <div id="bm-choices" class="bm-choices"></div>
      <div id="bm-feedback" class="bm-feedback"></div>
      <div class="bm-actions">
        <button id="bm-potion" class="bm-potion">🧪 포션 사용 (0)</button>
        <button id="bm-notepad" class="bm-notepad-btn">📝 풀이 노트 (N)</button>
      </div>
      <div class="bm-hint">키보드 1~4 = 답 · H = 포션 · ESC = 도주</div>
    </div>
  </div>

  <!-- 상점 모달 -->
  <div id="shop-modal" class="shop-modal">
    <div class="shop-card">
      <div class="shop-header">
        <div id="shop-title" class="shop-title">상점</div>
        <div class="shop-gold-bar">💰 <span id="shop-gold">0</span> G</div>
        <button id="shop-close" class="shop-close">✕</button>
      </div>
      <div id="shop-items" class="shop-items"></div>
      <div class="shop-hint">ESC = 닫기</div>
    </div>
  </div>

  <!-- 로그인/회원가입 모달 -->
  <div id="login-modal" class="login-modal">
    <div class="login-card">
      <div class="login-title">⚔️ 분수 던전</div>
      <div class="login-subtitle">학생 입장</div>

      <div class="login-section-label">🧑‍🎓 기존 학생 (클릭하여 시작)</div>
      <div id="login-student-grid" class="login-student-grid"></div>

      <form id="login-form" class="login-form" autocomplete="off">
        <input type="hidden" id="login-mode" value="signup" />
        <label class="login-label">닉네임 (2~12자, 한글/영문/숫자)</label>
        <input type="text" id="login-nickname" class="login-input"
          maxlength="12" placeholder="예: 영민이" required />

        <label class="login-label">PIN (숫자 4자리)</label>
        <input type="password" id="login-pin" class="login-input"
          inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
          placeholder="****" required />

        <label class="login-label" id="login-classcode-label">학급 코드 (선택, 비우면 default)</label>
        <input type="text" id="login-classcode" class="login-input"
          maxlength="20" placeholder="예: 5-3반" />

        <div id="login-error" class="login-error"></div>

        <button type="submit" id="login-submit" class="login-submit">
          ➕ 새 학생 등록
        </button>
        <button type="button" id="login-toggle" class="login-toggle">
          ↩ 기존 학생 로그인
        </button>
      </form>
    </div>
  </div>

  <!-- 필기 노트 (N 키 토글) -->
  <div id="notepad" class="notepad">
    <div class="np-toolbar">
      <button class="np-tool active" data-tool="pen-black" title="검정 펜">✏️</button>
      <button class="np-tool" data-tool="pen-blue" title="파랑 펜">🖊️</button>
      <button class="np-tool" data-tool="pen-red" title="빨강 펜">🖍️</button>
      <button class="np-tool" data-tool="eraser" title="지우개">🧽</button>
      <button class="np-clear" title="전체 지우기">🗑️</button>
      <div class="np-spacer"></div>
      <div class="np-title">📝 풀이 노트</div>
      <button class="np-close" title="닫기 (N)">✕</button>
    </div>
    <canvas id="np-canvas" class="np-canvas"></canvas>
    <div class="np-hint">통분 · 약분 · 계산 과정을 적어보세요</div>
  </div>

  <script type="module" src="js/rpg/main.js"></script>
</body>
</html>
